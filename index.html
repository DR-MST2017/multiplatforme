<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM Master — 125 Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RESET & VARIABLES
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-0: #0a0e1a;
  --bg-1: #111827;
  --bg-2: #1a2235;
  --bg-3: #232d45;
  --surface: rgba(26, 34, 53, 0.7);
  --surface-solid: #1a2235;
  --border: rgba(148, 163, 184, 0.12);
  --border-strong: rgba(148, 163, 184, 0.25);
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --text-faint: #64748b;
  --primary: #6366f1;
  --primary-light: #818cf8;
  --primary-dark: #4f46e5;
  --success: #10b981;
  --success-bg: rgba(16, 185, 129, 0.12);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.12);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.12);
  --gradient-1: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
  --gradient-2: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
  --gradient-3: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
  --gradient-4: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.4);
  --shadow-glow: 0 0 24px rgba(99, 102, 241, 0.25);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
  --bg-0: #f1f5f9;
  --bg-1: #ffffff;
  --bg-2: #f8fafc;
  --bg-3: #e2e8f0;
  --surface: rgba(255, 255, 255, 0.8);
  --surface-solid: #ffffff;
  --border: rgba(15, 23, 42, 0.08);
  --border-strong: rgba(15, 23, 42, 0.15);
  --text: #0f172a;
  --text-dim: #475569;
  --text-faint: #94a3b8;
  --success-bg: rgba(16, 185, 129, 0.1);
  --danger-bg: rgba(239, 68, 68, 0.1);
  --warning-bg: rgba(245, 158, 11, 0.1);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-0);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
}

/* Background decoration */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.06) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ============================================================
   LAYOUT
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
  background: var(--surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  padding: 24px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  transition: background 0.3s, border-color 0.3s;
}

.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.brand {
  padding: 0 24px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 4px;
}

.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--gradient-1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: var(--shadow-glow);
}

.brand-title {
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.brand-sub {
  font-size: 0.75rem;
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.nav-section-title {
  padding: 0 24px;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-faint);
  margin-bottom: 12px;
}

.nav-list {
  list-style: none;
  padding: 0 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition);
  color: var(--text-dim);
  font-weight: 500;
  font-size: 0.9rem;
  position: relative;
  border: 1px solid transparent;
}

.nav-item:hover {
  background: var(--bg-2);
  color: var(--text);
}

.nav-item.active {
  background: var(--gradient-1);
  color: white;
  box-shadow: var(--shadow-glow);
}

.nav-item.active .nav-count {
  background: rgba(255, 255, 255, 0.25);
  color: white;
}

.nav-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--bg-3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
}

.nav-item.active .nav-icon {
  background: rgba(255, 255, 255, 0.2);
}

.nav-label {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-count {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--bg-3);
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
}

.sidebar-footer {
  margin-top: auto;
  padding: 20px 24px 0;
  border-top: 1px solid var(--border);
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text-faint);
  margin-bottom: 8px;
  font-weight: 600;
}

.progress-bar {
  height: 8px;
  background: var(--bg-3);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 20px;
}

.progress-fill {
  height: 100%;
  background: var(--gradient-1);
  border-radius: 4px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%;
}

.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 10px;
  border-radius: var(--radius-md);
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85rem;
  transition: var(--transition);
  font-family: inherit;
}

.theme-toggle:hover {
  background: var(--bg-3);
  color: var(--text);
}

/* ============================================================
   MAIN
   ============================================================ */
.main {
  padding: 32px 40px 80px;
  max-width: 100%;
  overflow-x: hidden;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.page-title {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.2;
}

.page-subtitle {
  color: var(--text-dim);
  font-size: 0.9rem;
  margin-top: 4px;
}

.topbar-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  font-family: inherit;
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}

.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: var(--gradient-1);
  color: white;
  box-shadow: var(--shadow-glow);
}
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 0 32px rgba(99, 102, 241, 0.4); }

.btn-ghost {
  background: var(--surface);
  color: var(--text-dim);
  border-color: var(--border-strong);
  backdrop-filter: blur(10px);
}
.btn-ghost:hover:not(:disabled) { background: var(--bg-3); color: var(--text); }

/* ============================================================
   STATS CARDS
   ============================================================ */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--surface);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
  transition: var(--transition);
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--gradient-1);
}

.stat-card.green::before { background: var(--gradient-3); }
.stat-card.orange::before { background: var(--gradient-4); }
.stat-card.blue::before { background: var(--gradient-2); }

.stat-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  color: var(--text-faint);
  margin-bottom: 6px;
}

.stat-value {
  font-size: 1.5rem;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -0.03em;
  line-height: 1.1;
}

.stat-value small {
  font-size: 0.85rem;
  color: var(--text-faint);
  font-weight: 600;
}

/* ============================================================
   SESSION VIEW
   ============================================================ */
.session-view {
  display: none;
  animation: fadeIn 0.3s ease;
}

.session-view.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.session-header {
  background: var(--surface);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 24px 28px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.session-header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.session-badge {
  width: 56px;
  height: 56px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  color: white;
  flex-shrink: 0;
  box-shadow: var(--shadow-md);
}

.session-header h2 {
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.session-header p {
  font-size: 0.85rem;
  color: var(--text-dim);
}

.session-progress {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.85rem;
  color: var(--text-dim);
  font-weight: 600;
}

.session-progress .mini-bar {
  width: 120px;
  height: 6px;
  background: var(--bg-3);
  border-radius: 3px;
  overflow: hidden;
}

.session-progress .mini-fill {
  height: 100%;
  background: var(--gradient-3);
  width: 0%;
  transition: width 0.4s;
}

/* ============================================================
   QUESTION CARD
   ============================================================ */
.question-card {
  background: var(--surface);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  margin-bottom: 16px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.question-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--border-strong);
  transition: var(--transition);
}

.question-card.correct::before { background: var(--success); }
.question-card.wrong::before { background: var(--danger); }
.question-card.unanswered::before { background: var(--warning); }

.question-card.correct { background: linear-gradient(90deg, var(--success-bg), var(--surface) 60%); }
.question-card.wrong { background: linear-gradient(90deg, var(--danger-bg), var(--surface) 60%); }

.q-head {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 16px;
}

.q-index {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--bg-3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.85rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-dim);
}

.question-card.correct .q-index { background: var(--success); color: white; }
.question-card.wrong .q-index { background: var(--danger); color: white; }

.q-text {
  font-weight: 600;
  font-size: 1rem;
  line-height: 1.5;
  flex: 1;
  padding-top: 6px;
}

.choices {
  display: grid;
  gap: 8px;
  margin-left: 50px;
}

.choice {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition);
  background: var(--bg-1);
  user-select: none;
  position: relative;
}

.choice:hover:not(.disabled) {
  border-color: var(--primary);
  background: var(--bg-2);
  transform: translateX(2px);
}

.choice input { display: none; }

.choice-radio {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--border-strong);
  flex-shrink: 0;
  margin-top: 1px;
  position: relative;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.choice-radio::after {
  content: '';
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: transparent;
  transition: var(--transition);
}

.choice.selected {
  border-color: var(--primary);
  background: rgba(99, 102, 241, 0.08);
}

.choice.selected .choice-radio {
  border-color: var(--primary);
}

.choice.selected .choice-radio::after {
  background: var(--primary);
}

.choice-letter {
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-faint);
  font-size: 0.85rem;
  flex-shrink: 0;
  min-width: 18px;
  margin-top: 1px;
}

.choice-label {
  flex: 1;
  font-size: 0.92rem;
  color: var(--text);
}

.choice.disabled { cursor: default; }

.choice.correct-answer {
  border-color: var(--success);
  background: var(--success-bg);
}

.choice.correct-answer .choice-radio {
  border-color: var(--success);
  background: var(--success);
}

.choice.correct-answer .choice-radio::after {
  background: white;
  width: 8px;
  height: 8px;
}

.choice.correct-answer .choice-letter { color: var(--success); }

.choice.wrong-answer {
  border-color: var(--danger);
  background: var(--danger-bg);
}

.choice.wrong-answer .choice-radio {
  border-color: var(--danger);
  background: var(--danger);
}

.choice.wrong-answer .choice-radio::after {
  background: white;
  width: 8px;
  height: 8px;
}

.choice.wrong-answer .choice-letter { color: var(--danger); }

.choice.correct-answer::after {
  content: '✓';
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--success);
  font-weight: 800;
  font-size: 1.1rem;
}

.choice.wrong-answer::after {
  content: '✗';
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--danger);
  font-weight: 800;
  font-size: 1.1rem;
}

.explanation {
  margin-left: 50px;
  margin-top: 14px;
  padding: 14px 16px;
  background: var(--success-bg);
  border-left: 3px solid var(--success);
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  color: var(--text);
  display: none;
  animation: slideDown 0.3s ease;
}

.explanation.show { display: block; }

.explanation strong {
  color: var(--success);
  font-weight: 700;
  display: block;
  margin-bottom: 4px;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-badge {
  display: none;
  margin-left: 50px;
  margin-top: 10px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 700;
  width: fit-content;
  align-items: center;
  gap: 6px;
}

.result-badge.show { display: inline-flex; }
.result-badge.ok { background: var(--success); color: white; }
.result-badge.ko { background: var(--danger); color: white; }
.result-badge.na { background: var(--warning); color: white; }

/* ============================================================
   MOBILE
   ============================================================ */
.mobile-nav-toggle {
  display: none;
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 200;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  background: var(--surface);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border-strong);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 90;
}

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }

  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 280px;
    z-index: 100;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    height: 100vh;
  }

  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }

  .mobile-nav-toggle { display: flex; }

  .main { padding: 76px 16px 60px; }

  .choices, .explanation, .result-badge { margin-left: 0; }

  .page-title { font-size: 1.4rem; }

  .topbar { flex-direction: column; align-items: flex-start; }

  .session-header { padding: 18px 20px; }

  .question-card { padding: 18px; }
}

@media (max-width: 480px) {
  .stat-value { font-size: 1.2rem; }
  .q-text { font-size: 0.92rem; }
  .choice-label { font-size: 0.85rem; }
  .session-badge { width: 44px; height: 44px; font-size: 1.1rem; }
}

/* Scrollbar global */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-0); }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
</style>
</head>
<body>

<button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Menu">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <div class="brand-icon">🎯</div>
        <div>
          <div class="brand-title">QCM Master</div>
          <div class="brand-sub">125 questions</div>
        </div>
      </div>
    </div>

    <div class="nav-section-title">Sessions</div>
    <ul class="nav-list" id="navList"></ul>

    <div class="sidebar-footer">
      <div class="progress-label">
        <span>Progression</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <button class="theme-toggle" id="themeToggle">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel">Mode sombre</span>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="topbar">
      <div>
        <h1 class="page-title" id="pageTitle">Session 01 — Fondamentaux</h1>
        <p class="page-subtitle" id="pageSubtitle">Cochez vos réponses puis affichez la correction.</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btnReset">🔄 Réinitialiser</button>
        <button class="btn btn-primary" id="btnCorrect">✅ Afficher les corrections</button>
      </div>
    </div>

    <di
